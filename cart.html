<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 class="logo">Cars &amp; Bikes</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="bikes.html">Bikes</a>
      <a href="cars.html">Cars</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <section>
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div id="cart-total"></div>
    <button class="remove-btn" onclick="clearCart()">Clear Cart</button>

    <h2>Place Order</h2>
    <form id="orderForm" onsubmit="sendFeedback(event)">
      <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">
      <input type="hidden" name="subject" value="New Order - Cars & Bikes">

      <label for="fullname">Name</label>
      <input type="text" id="fullname" name="name" placeholder="Your name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="10 digit phone number"
             maxlength="10" pattern="[0-9]{10}" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Your email" required>

      <label for="item">Cart Items</label>
      <input type="text" id="item" name="items" readonly
             placeholder="Cart is empty - add a car or bike first">

      <input type="hidden" id="total" name="total_price">

      <button type="submit">Place Order</button>
      <p class="result"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Cars &amp; Bikes</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
