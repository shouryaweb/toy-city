<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1 class="logo">Cars &amp; Bikes</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="guns.html">Bikes</a>
      <a href="cars.html">Cars</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <section>
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div id="cart-total"></div>
    <button class="remove-btn" onclick="clearCart()">Clear Cart</button>

    <h2>Place Order</h2>
    <form id="orderForm" onsubmit="sendFeedback(event)">
      <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">

      <label for="fullname">Name</label>
      <input type="text" id="fullname" placeholder="Your name">

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="10 digit phone number" maxlength="10">

      <label for="email">Email</label>
      <input type="text" id="email" placeholder="Your email">

      <label for="item">Cart Items</label>
      <input type="text" id="item" readonly placeholder="Cart is empty - add a car or bike first">

      <button type="submit">Place Order</button>
      <p class="result"></p>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Cars &amp; Bikes</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
